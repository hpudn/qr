<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dấu Ấn Sinh Viên - Cyberpunk Wallpaper 🌌</title>
    <!-- Nhúng Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nhúng thư viện QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Nhúng thư viện html2canvas để chụp ảnh trọn vẹn hình nền -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        'cyber-bg': '#050505',      /* Nền đen sâu thẳm */
                        'cyber-green': '#86efac',   /* Xanh lá mạ phát sáng */
                        'cyber-neon': '#4ade80',    /* Xanh neon mạnh hơn */
                        'cyber-purple': '#9333ea',  /* Tím của sticker */
                        'card-bg': 'rgba(255, 255, 255, 0.03)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ❀ Hiệu ứng hạt bụi không gian (Cyber Particles) */
        .particles-bg {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(74, 222, 128, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(74, 222, 128, 0.05) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* ❀ Lưới ma trận mờ ảo phía sau */
        .matrix-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(74, 222, 128, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(74, 222, 128, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
            z-index: 0;
        }

        /* ❀ Khu vực Khung Hình Nền Khóa (Phone Wallpaper Ratio) */
        #wallpaper-preview {
            aspect-ratio: 9 / 19.5; /* Tỉ lệ màn hình điện thoại hiện đại */
            width: 100%;
            max-width: 340px;
            position: relative;
            background-color: #080a08;
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(74, 222, 128, 0.1);
            display: none; /* Ban đầu ẩn đi */
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #wallpaper-preview.show {
            display: block;
            transform: scale(1);
            opacity: 1;
        }

        /* ❀ Tấm thẻ trong suốt (Glass Card) có vết cắt (notch) như thiết kế anh gửi */
        .glass-card {
            background: rgba(20, 30, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(74, 222, 128, 0.15);
            border-radius: 2rem;
            position: relative;
        }

        /* Vết cắt (Notch) mô phỏng ở cạnh trên của thẻ */
        .card-notch {
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 20px;
            background: #080a08;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.15);
            border-left: 1px solid rgba(74, 222, 128, 0.15);
            border-right: 1px solid rgba(74, 222, 128, 0.15);
        }

        /* Ép mã QR phủ kín container */
        #qrcode img, #qrcode canvas {
            width: 100% !important;
            height: auto !important;
            border-radius: 12px;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-white w-full">

    <div class="particles-bg"></div>
    <div class="matrix-grid"></div>

    <div class="w-full max-w-[400px] mx-auto min-h-[100dvh] flex flex-col p-6 relative z-10 items-center justify-center">

        <!-- ========================================== -->
        <!-- MÀN HÌNH 1: KHU VỰC NHẬP LIỆU BẮT ĐẦU       -->
        <!-- ========================================== -->
        <div id="input-section" class="w-full flex flex-col items-center transition-all duration-500">
            <h1 class="text-4xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyber-green to-white text-center">
                CT2901
            </h1>
            <p class="text-gray-400 text-sm mb-10 text-center">Nhập mã sinh viên để tạo hình nền khóa</p>

            <div class="w-full relative mb-6">
                <input 
                    type="text" 
                    id="studentId" 
                    placeholder="Nhập mã sinh viên..." 
                    class="w-full bg-[#111] text-white text-lg rounded-2xl px-6 py-4 text-center focus:outline-none focus:ring-2 focus:ring-cyber-green transition-all font-medium border border-white/10 placeholder:text-gray-600"
                >
                <p id="errorMessage" class="absolute -top-6 left-0 w-full text-center text-cyber-neon text-xs opacity-0 transition-opacity font-semibold">
                    ❀ Ôi, anh Hoàng quên nhập thông tin rồi nè...
                </p>
            </div>

            <button 
                onclick="generateWallpaper()" 
                class="w-full bg-cyber-green hover:bg-cyber-neon active:scale-95 text-[#050505] rounded-full py-4 text-[17px] font-bold tracking-wide transition-all duration-300 flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(74,222,128,0.3)]"
            >
                Khởi tạo Hình Nền
            </button>
        </div>

        <!-- ========================================== -->
        <!-- MÀN HÌNH 2: KHUNG PREVIEW HÌNH NỀN KHÓA    -->
        <!-- (Khu vực này sẽ được chụp lại bằng html2canvas) -->
        <!-- ========================================== -->
        <div id="wallpaper-wrapper" class="w-full flex flex-col items-center hidden">
            
            <!-- Đây là bản thể hình nền sẽ được chụp -->
            <div id="wallpaper-preview" class="mb-6 relative">
                <!-- Nền của điện thoại (họa tiết xước mờ) -->
                <div class="absolute inset-0 bg-[#080a08] overflow-hidden">
                    <div class="absolute w-[200%] h-[200%] top-[-50%] left-[-50%] opacity-20" style="background-image: radial-gradient(circle, rgba(134, 239, 172, 0.4) 0%, transparent 60%);"></div>
                    <!-- Các chấm sáng nhỏ li ti -->
                    <div class="absolute top-[20%] left-[10%] w-1 h-1 bg-cyber-green rounded-full shadow-[0_0_10px_#86efac]"></div>
                    <div class="absolute top-[60%] right-[15%] w-1.5 h-1.5 bg-cyber-green rounded-full shadow-[0_0_15px_#86efac] opacity-60"></div>
                </div>

                <!-- Tấm thẻ nội dung chính giữa màn hình -->
                <div class="absolute inset-0 p-6 flex flex-col items-center justify-center z-10">
                    
                    <div class="glass-card w-full p-8 flex flex-col items-center shadow-2xl">
                        <!-- Vết cắt giả lập ở viền trên tấm thẻ -->
                        <div class="card-notch"></div>

                        <h2 class="text-4xl font-black text-cyber-green mb-8 text-center leading-tight tracking-tight mt-2 tracking-widest">
                            CT2901
                        </h2>

                        <!-- Khung chứa QR -->
                        <div class="relative w-full aspect-square bg-cyber-green p-2 rounded-2xl shadow-[0_0_30px_rgba(74,222,128,0.2)] mb-8">
                            
                            <!-- Nơi mã QR hiển thị -->
                            <div id="qrcode" class="w-full h-full bg-[#080a08] rounded-xl flex items-center justify-center overflow-hidden"></div>
                            
                        </div>

                        <!-- Thông tin phụ -->
                        <div class="w-full flex flex-col items-center gap-2">
                            <p class="text-gray-400 text-xs uppercase tracking-widest font-semibold">Mã Định Danh</p>
                            <p id="displayId" class="text-white text-lg font-bold tracking-wider">---</p>
                            <div class="h-[1px] w-1/2 bg-cyber-green/30 my-2"></div>
                            <p class="text-cyber-green text-xs opacity-80">QR SCAN ROLL CALL</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Nút Tải Hình Nền & Nút Quay Lại -->
            <div class="w-full flex gap-3 opacity-0 transform translate-y-4 transition-all duration-500 delay-300" id="action-buttons">
                <button 
                    onclick="resetForm()" 
                    class="w-14 h-14 bg-[#111] hover:bg-[#222] border border-white/10 text-white rounded-2xl flex items-center justify-center flex-shrink-0 transition-colors"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>

                <button 
                    onclick="downloadWallpaper()" 
                    id="downloadBtn"
                    class="flex-1 bg-cyber-green hover:bg-cyber-neon active:scale-95 text-[#050505] rounded-2xl py-4 text-[16px] font-bold tracking-wide transition-all duration-300 flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(74,222,128,0.3)]"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>Lưu Hình Nền Khóa</span>
                </button>
            </div>

        </div>
    </div>

    <!-- 🪄 Phép thuật Logic của Hân -->
    <script>
        const studentInput = document.getElementById('studentId');
        const errorMsg = document.getElementById('errorMessage');
        const inputSection = document.getElementById('input-section');
        const wallpaperWrapper = document.getElementById('wallpaper-wrapper');
        const wallpaperPreview = document.getElementById('wallpaper-preview');
        const actionButtons = document.getElementById('action-buttons');
        const qrcodeElement = document.getElementById('qrcode');
        const displayId = document.getElementById('displayId');
        
        let qrCodeObj = null;

        studentInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') generateWallpaper();
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.remove('opacity-0');
            studentInput.classList.add('border-cyber-green/50');
            setTimeout(() => {
                errorMsg.classList.add('opacity-0');
                studentInput.classList.remove('border-cyber-green/50');
            }, 3000);
        }

        function generateWallpaper() {
            const text = studentInput.value.replace(/\s+/g, '');
            
            if (!text) {
                showError('❀ Nhập mã sinh viên để Hân làm hình nền nhé!');
                return;
            }

            // Cập nhật text hiển thị trên thẻ
            displayId.textContent = text;
            
            // Xóa mã QR cũ
            qrcodeElement.innerHTML = ''; 
            
            try {
                // Hân dùng màu Xanh Neon cho mã QR, nền Đen thẳm để chuẩn Cyberpunk
                qrCodeObj = new QRCode(qrcodeElement, {
                    text: text,
                    width: 512, 
                    height: 512,
                    colorDark : "#86efac", 
                    colorLight : "#080a08", 
                    correctLevel : QRCode.CorrectLevel.M 
                });

                // Chuyển đổi màn hình: Ẩn form nhập, Hiện Wallpaper
                inputSection.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
                wallpaperWrapper.classList.remove('hidden');
                
                // Kích hoạt hiệu ứng xuất hiện mềm mại
                setTimeout(() => {
                    wallpaperPreview.classList.add('show');
                    actionButtons.classList.remove('opacity-0', 'translate-y-4');
                }, 50);

            } catch (error) {
                showError('❀ Dữ liệu đang bị quá tải, anh thử rút gọn lại nha...');
            }
        }

        function resetForm() {
            // Quay lại màn hình nhập liệu
            wallpaperPreview.classList.remove('show');
            actionButtons.classList.add('opacity-0', 'translate-y-4');
            
            setTimeout(() => {
                wallpaperWrapper.classList.add('hidden');
                inputSection.classList.remove('hidden');
                setTimeout(() => {
                    inputSection.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                }, 50);
            }, 500);
        }

        // ❀ Phép thuật xuất ảnh từ HTML của Hân ❀
        function downloadWallpaper() {
            const btn = document.getElementById('downloadBtn');
            const originalText = btn.innerHTML;
            
            // Đổi trạng thái nút để báo cho anh Hoàng biết Hân đang xử lý
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang nén năng lượng...`;
            
            // Dùng html2canvas để chụp lại khối #wallpaper-preview
            html2canvas(wallpaperPreview, {
                scale: 3, // Phóng to gấp 3 lần để ảnh nét căng như Sony!
                useCORS: true,
                backgroundColor: '#080a08' // Đảm bảo nền màu đen sâu
            }).then(canvas => {
                // Tạo link tải ảnh
                const link = document.createElement('a');
                link.download = `LockScreen_${studentInput.value.replace(/\s+/g, '')}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();

                // Trả lại trạng thái nút
                btn.innerHTML = originalText;
            }).catch(err => {
                alert("❀ Hân xin lỗi, có chút trục trặc khi tạo ảnh rồi ạ!");
                btn.innerHTML = originalText;
            });
        }
    </script>
</body>
</html>
